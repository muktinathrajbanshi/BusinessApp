<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Business App</title>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-10 col-11 mx-auto">
          <div class="row mt-5 gx-3">
            <!-- left side div  -->
            <div
              class="col-md-12 col-lg-8 col-11 mx-auto main_cart mb-lg-0 mb-5 shadow"
            >
              <div class="card p-4">
                <h2 class="py-4 font-weight-bold">Cart (2 items)</h2>
                <div class="row">
                  <!-- cart images div  -->
                  <div
                    class="col-md-5 col-11 mx-auto bg-light d-flex justify-content-center align-items-center shadow product_img"
                  >
                    <img
                      src="images/shirt.png"
                      alt="cart image"
                      class="img-fluid"
                    />
                  </div>

                  <!-- card product details  -->
                  <div class="col-md-7 col-11 mx-auto px-4 mt-2">
                    <div class="row">
                      <!-- product name  -->
                      <div class="col-6 card-title">
                        <h1 class="mb-4 product_name">Check Zara Shirt</h1>
                        <p class="mb-2">SHIRT - WHITE</p>
                        <p class="mb-2">COLOR: WHITE</p>
                        <p class="mb-3">SIZE: M</p>
                      </div>

                      <!-- quantity inc dec  -->
                      <div class="col-6">
                        <ul class="pagination justify-content-end set_quantity">
                          <li class="page-item">
                            <button class="page-link" onclick="decreaseNumber()"><i class="fa-solid fa-minus"></i></button>
                          </li>
                          <li class="page-item">
                            <input type="text" name="" class="page-link" value="1" id="textbox" ></input>
                          </li>
                          <li class="page-item">
                            <button class="page-link" onclick="increaseNumber()"><i class="fa-solid fa-plus"></i></button>
                          </li>
                        </ul>
                      </div>
                    </div>
                    <!-- remove move and price  -->
                     <div class="row">
                      <div class="col-8 d-flex justify-content-between remove_wish">
                        <p><i class="fas fa-trash-alt"></i>REMOVE ITEM</p>
                        <p><i class="fas fa-heart"></i>MOVE TO WISH LIST</p>
                      </div>
                      <div class="col-4 d-flex justify-content-end price_money">
                        <h3>$<span id="itemval">0.00</h3>
                      </div>
                     </div>
                  </div>
                </div>
              </div>

              <!-- second card product  -->
              <div class="card p-4">
                <div class="row">
                  <!-- cart images div  -->
                  <div
                    class="col-md-5 col-11 mx-auto bg-light d-flex justify-content-center align-items-center shadow product_img"
                  >
                    <img
                      src="images/shirt.png"
                      alt="cart image"
                      class="img-fluid"
                    />
                  </div>

                  <!-- card product details  -->
                  <div class="col-md-7 col-11 mx-auto px-4 mt-2">
                    <div class="row">
                      <!-- product name  -->
                      <div class="col-6 card-title">
                        <h1 class="mb-4 product_name">Green Zara Shirt</h1>
                        <p class="mb-2">SHIRT - Green</p>
                        <p class="mb-2">COLOR: Green</p>
                        <p class="mb-3">SIZE: M</p>
                      </div>

                      <!-- quantity inc dec  -->
                      <div class="col-6">
                        <ul class="pagination justify-content-end set_quantity">
                          <li class="page-item">
                            <button class="page-link" onclick="decreaseNumber()"><i class="fa-solid fa-minus"></i></button>
                          </li>
                          <li class="page-item">
                            <input type="text" name="" class="page-link" value="1" id="textbox" ></input>
                          </li>
                          <li class="page-item">
                            <button class="page-link" onclick="increaseNumber()"><i class="fa-solid fa-plus"></i></button>
                          </li>
                        </ul>
                      </div>
                    </div>
                    <!-- remove move and price  -->
                     <div class="row">
                      <div class="col-8 d-flex justify-content-between remove_wish">
                        <p><i class="fas fa-trash-alt"></i>REMOVE ITEM</p>
                        <p><i class="fas fa-heart"></i>MOVE TO WISH LIST</p>
                      </div>
                      <div class="col-4 d-flex justify-content-end price_money">
                        <h3>$<span id="itemval">0.00</h3>
                      </div>
                     </div>
                  </div>
                </div>
              </div>

            </div>

            <!-- right side div  --> 
             <div class="col-md-12 col-lg-4 col-11 mx-auto mt-lg-0 mt-md-5">
                <div class="right_side p-3 shadow bg-white">
                  <h2 class="product_name mb-5">The Total Amount Of</h2>
                </div>
             </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
